name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that opencode-memory does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A new tool, an option, a setting, a change to the injected block…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Injected memory block
        - Tools (memory_add / list / forget / pin)
        - Scoping (shared vs project)
        - Storage / eviction / mirror
        - Configuration
        - Documentation
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues and discussions.
